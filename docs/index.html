<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>College Event Management</h1>
        <p>Upcoming events, workshops and seminars</p>
    </header>

    <nav>
        <button class="filter active" data-type="All">All</button>
        <button class="filter" data-type="Event">Events</button>
        <button class="filter" data-type="Workshop">Workshops</button>
        <button class="filter" data-type="Seminar">Seminars</button>
    </nav>

    <main>
        <p id="count"></p>
        <div id="events"></div>
    </main>

    <footer>
        <p>&copy; 2026 College Event Management | Built with HTML, CSS, JavaScript and Maven</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
